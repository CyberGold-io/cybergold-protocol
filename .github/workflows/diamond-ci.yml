name: Diamond CI

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  dependency-security:
    name: dependency-security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the proposed dependency graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Test policy decisions
        run: python3 ci/test_dependency_security.py
      - name: Scan all resolved dependency scopes and apply explicit exceptions
        run: python3 ci/check-dependency-security.py --report "$RUNNER_TEMP/dependency-security.json"
      - name: Retain accepted and blocking findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-security.json
          if-no-files-found: warn

  validated_inputs:
    name: validated-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      digest: ${{ steps.reuse.outputs.digest }}
    steps:
      - name: Checkout tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and reuse policy
        run: |
          python3 ci/check-docs.py
          python3 ci/test-reuse-contract-tests.py
      - name: Find successful tests for identical inputs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/reuse-contract-tests.py

  branch_policy:
    name: branch-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout branch policy without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up policy Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate pull-request branch topology
        if: github.event_name == 'pull_request'
        env:
          BRANCH_POLICY_REPOSITORY: ${{ github.repository }}
          BRANCH_POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH_POLICY_BASE_REF: ${{ github.base_ref }}
          BRANCH_POLICY_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-policy.mjs pull-request

      - name: Authenticate protected-branch push as a pull-request merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_POLICY_REPOSITORY: ${{ github.repository }}
          BRANCH_POLICY_REF_NAME: ${{ github.ref_name }}
          BRANCH_POLICY_SHA: ${{ github.sha }}
          BRANCH_POLICY_BEFORE_SHA: ${{ github.event.before }}
          BRANCH_POLICY_FORCED: ${{ github.event.forced }}
          BRANCH_POLICY_CREATED: ${{ github.event.created }}
          BRANCH_POLICY_DELETED: ${{ github.event.deleted }}
          BRANCH_POLICY_PULL_REQUESTS_FILE: ${{ runner.temp }}/associated-pull-requests.json
          BRANCH_POLICY_COMMIT_FILE: ${{ runner.temp }}/pushed-commit.json
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
              > "$BRANCH_POLICY_COMMIT_FILE" \
              && gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
                > "$BRANCH_POLICY_PULL_REQUESTS_FILE" \
              && jq -e --arg sha "$GITHUB_SHA" \
                'any(.[]; .merge_commit_sha == $sha)' \
                "$BRANCH_POLICY_PULL_REQUESTS_FILE" >/dev/null \
              && node scripts/check-branch-policy.mjs push; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              node scripts/check-branch-policy.mjs push || true
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

  static_analysis:
    name: static-analysis
    needs: validated_inputs
    if: ${{ needs.validated_inputs.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    env:
      FOUNDRY_OFFLINE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install pinned security analyzers
        run: ci/install-security-tools.sh /tmp/cybergold-security-tools

      - name: Run static-analysis regression gate
        env:
          SECURITY_TOOLS_DIR: /tmp/cybergold-security-tools
        run: ci/check-static-analysis.sh

      - name: Retain static-analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-static-analysis
          path: out/security-analysis/
          if-no-files-found: error

  symbolic_properties:
    name: symbolic-properties
    needs: validated_inputs
    if: ${{ needs.validated_inputs.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    env:
      FOUNDRY_OFFLINE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install pinned security analyzers
        run: ci/install-security-tools.sh /tmp/cybergold-security-tools

      - name: Prove bounded security properties
        env:
          SECURITY_TOOLS_DIR: /tmp/cybergold-security-tools
          SECURITY_ANALYSIS_MODE: ${{ github.event_name == 'schedule' && 'full' || 'bounded' }}
        run: ci/check-symbolic-properties.sh

      - name: Retain symbolic-property evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-symbolic-properties
          path: out/security-analysis/
          if-no-files-found: error

  test_suite:
    name: test-suite
    needs: validated_inputs
    if: ${{ needs.validated_inputs.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    env:
      FOUNDRY_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Prefetch exact Solidity compiler
        env:
          FOUNDRY_OFFLINE: "false"
        run: ci/prefetch-solc.sh

      - name: Install pinned Gitleaks
        run: |
          ci/install-gitleaks.sh /tmp/gitleaks
          echo "GITLEAKS_BIN=/tmp/gitleaks" >> "$GITHUB_ENV"

      - name: Dependency freshness advisory
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ci/check-dependency-freshness.sh --warn-only

      - name: Run test suite
        run: script/test.sh

      - name: Retain bounded-parallel gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-test-gate-logs
          path: out/ci/protocol-heavy/
          if-no-files-found: error

  diamond_checks:
    name: diamond-checks
    if: ${{ always() }}
    needs:
      - dependency-security
      - validated_inputs
      - branch_policy
      - static_analysis
      - symbolic_properties
      - test_suite
    runs-on: ubuntu-latest
    steps:
      - name: Require every Protocol gate
        env:
          DEPENDENCY_SECURITY_RESULT: ${{ needs['dependency-security'].result }}
          INPUTS_RESULT: ${{ needs.validated_inputs.result }}
          REUSED: ${{ needs.validated_inputs.outputs.reused }}
          INPUT_DIGEST: ${{ needs.validated_inputs.outputs.digest }}
          BRANCH_POLICY_RESULT: ${{ needs.branch_policy.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          SYMBOLIC_PROPERTIES_RESULT: ${{ needs.symbolic_properties.result }}
          TEST_SUITE_RESULT: ${{ needs.test_suite.result }}
        run: |
          test "$DEPENDENCY_SECURITY_RESULT" = success
          test "$INPUTS_RESULT" = "success"
          test "$BRANCH_POLICY_RESULT" = "success"
          expected=success
          if [[ "$REUSED" == "true" ]]; then expected=skipped; fi
          for result in "$STATIC_ANALYSIS_RESULT" "$SYMBOLIC_PROPERTIES_RESULT" "$TEST_SUITE_RESULT"; do
            test "$result" = "$expected"
          done
          if [[ "$REUSED" != "true" ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('validated-inputs.json').write_text(json.dumps({
              'inputDigest': os.environ['INPUT_DIGEST'],
              'checks': {name: 'success' for name in ('static_analysis', 'symbolic_properties', 'test_suite')}
          }) + '\n')
          PY
          fi
      - name: Retain successful tested-input identity
        if: ${{ needs.validated_inputs.outputs.reused != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-inputs-${{ needs.validated_inputs.outputs.digest }}
          path: validated-inputs.json
          if-no-files-found: error
          retention-days: 90
