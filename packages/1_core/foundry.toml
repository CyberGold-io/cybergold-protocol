[profile.default]
solc_version = "0.8.38"
evm_version = "osaka"
libs = ["lib"]
src = "src"
test = "test"
cache_path = "../../cache"
offline = true
optimizer = true
# Runs=100 keeps every paused recovery facet below EIP-170 while
# preserving one unambiguous compiler artifact graph for tests and releases.
optimizer_runs = 100
auto_detect_remappings = false
allow_paths = ["src", "test", "lib", "../3_staking/src", "../0_shared/src", "../../test", "../../config"]
include_paths = ["../../lib"]
fs_permissions = [
  { access = "read", path = "config" },
  { access = "read", path = "test" },
  { access = "read", path = "../../config" },
  { access = "read", path = "generated" },
  { access = "read", path = "../../generated" },
  { access = "read-write", path = "out" },
  { access = "read-write", path = "../../out" },
  { access = "read-write", path = "../../../cybergold-ops/deployments" }
]
remappings = [
  "shared=../../test/",
  "diamond-infra=../0_shared/src/",
  "cybergold-core=../1_core/src/",
  "staking=../3_staking/src/",
  "staking-mocks=../3_staking/test/mocks/",
  "diamond-1=../../lib/diamond-1-hardhat/contracts/",
  "@openzeppelin/contracts=../../lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable=../../lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std=../../lib/forge-std/src/",
  "script=../../script/"
]
[lint]
ignore = ["../../lib/**", "../*/**/src/**", "../*/**/test/**", "lib/**"]
