[extend]
useDefault = true

[[allowlists]]
description = "Ethereum addresses are public identifiers, not secrets"
regexTarget = "match"
regexes = ['''0x[0-9a-fA-F]{40}''']

[[allowlists]]
description = "Anvil's documented default private key is a public local-development fixture"
regexTarget = "match"
regexes = ['''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''']
